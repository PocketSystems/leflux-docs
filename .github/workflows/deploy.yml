name: Deploy docs

# Builds the Astro Starlight docs and ships the static output to the same
# server path the docs have always lived at (/var/www/leflux/docs-site),
# Both leflux.ai and dev.leflux.ai serve this same static directory at /docs/.
#
# Needs three repo secrets:
#   SSH_PRIVATE_KEY  deploy key authorised on the box
#   SSH_HOST         server host/IP
#   SSH_USER         ssh user (root)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and ship docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install + build docs
        run: |
          cd docs-site
          npm ci
          npm audit --audit-level=high
          npm run build
          test -f dist/index.html || { echo "dist/index.html missing, build broken"; exit 1; }
          test -d dist/_astro     || { echo "dist/_astro missing, build broken"; exit 1; }
          ls -la dist/ | head -20

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST "chattr -R -i /var/www/leflux/docs-site 2>/dev/null || true; mkdir -p /var/www/leflux/docs-site"
          rsync -avz --delete docs-site/dist/ $SSH_USER@$SSH_HOST:/var/www/leflux/docs-site/
          ssh $SSH_USER@$SSH_HOST "chown -R www-data:www-data /var/www/leflux/docs-site || true"

      - name: Verify docs are live
        run: |
          for host in leflux.ai dev.leflux.ai; do
            OK=0
            for i in 1 2 3 4 5 6; do
              if curl -fsSL -m 8 "https://$host/docs/" | grep -q 'logo-clean'; then
                echo "✅ $host docs logo live on attempt $i"; OK=1; break
              fi
              echo "… $host attempt $i: not ready, retrying in 5s"; sleep 5
            done
            [ "$OK" = "1" ] || exit 1
          done

      - name: Summary
        if: success()
        run: |
          echo "🎉 Docs deployed"
          echo "📖 https://leflux.ai/docs/ and https://dev.leflux.ai/docs/"
